name: 사전 중계 워커 (도랏이)

# 브라우저는 국립국어원 OpenAPI를 CORS 때문에 직접 못 부른다.
# 앱이 공용 DB(/dictreq)에 남긴 사전 조회 요청을 이 워커가 대신 호출해 /dict 에 채운다.
on:
  schedule:
    - cron: "*/5 * * * *"      # 5분마다 새 워커 시작 (아래에서 ~4분30초간 계속 폴링)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dict-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 중계 실행
        env:
          STDICT_KEY: ${{ secrets.STDICT_KEY }}
          DB_URL: https://dorati-99953-default-rtdb.asia-southeast1.firebasedatabase.app
          RUN_FOR: "270"
          POLL_EVERY: "2"
        run: python relay/poller.py
