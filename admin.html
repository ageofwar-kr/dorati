<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도랏이 관리자 — 사람 학습 · 기본 내장</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/admin.css?v=1.0">
</head>
<body data-theme="ganji">

<div id="gate" class="gate" hidden>
  <form id="gate-form" autocomplete="off">
    <h2>🔒 관리자</h2>
    <p>학습 데이터와 내장 대화를 직접 보는 화면이에요.<br>패스코드를 입력해 주세요.</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="패스코드" autocomplete="off" aria-label="패스코드">
    <button type="submit">들어가기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<header>
  <h1>도랏이 관리자 <span class="sub">사람이 가르친 말 · 기본 내장 대화</span></h1>
  <div class="head-acts">
    <button id="theme-toggle" class="hbtn" type="button" aria-label="테마 바꾸기" title="간지모드 / 심플모드">🎛 간지모드</button>
    <button id="logout" class="hbtn" type="button">잠그기</button>
  </div>
</header>

<div class="tabs" role="tablist" aria-label="관리자 탭">
  <button id="tab-btn-human" role="tab" aria-selected="true" data-tab="human">사람 학습<span class="count" id="c-human">0</span></button>
  <button id="tab-btn-builtin" role="tab" aria-selected="false" data-tab="builtin">기본 내장<span class="count" id="c-builtin">-</span></button>
</div>

<!-- ══ 탭 1: 사람 학습 ══ -->
<section id="tab-human" class="wrap">

  <!-- 제미나이 자동 학습 -->
  <section class="teach" id="teach">
    <div class="teach-top">
      <h2>🤖 제미나이 자동 학습</h2>
      <span class="teach-model" id="teach-model">Gemini 3.8 Flash</span>
    </div>
    <p class="hint">제미나이가 도랏이한테 쓸 만한 말 5쌍을 만들어 공용 DB에 바로 저장해요. 저장된 말은 건전·일반·도랏 모든 모드에 즉시 반영됩니다.</p>

    <div class="teach-modes" role="tablist" aria-label="학습 방식">
      <button type="button" role="tab" data-teach-mode="auto" aria-selected="true">자동 모드</button>
      <button type="button" role="tab" data-teach-mode="custom" aria-selected="false">추가명령 모드</button>
    </div>

    <div class="teach-row">
      <select id="teach-target" aria-label="말투 모드">
        <option value="auto">말투: 골고루</option>
        <option value="clean">말투: 건전</option>
        <option value="normal">말투: 일반</option>
        <option value="dorat">말투: 도랏</option>
      </select>
      <input id="teach-topic" type="text" placeholder="주제 (선택) — 예: 요즘 밈, 일상 대화, 아재개그" aria-label="주제 (선택)">
    </div>

    <div id="teach-custom" hidden>
      <textarea id="teach-instruction" maxlength="300" placeholder="추가 명령을 적어주세요 — 예: 롤(LoL) 드립으로 5개 / 시험 기간 공감 대사 / 도랏 모드로 찰지게" aria-label="추가 명령"></textarea>
    </div>

    <div class="teach-act">
      <button id="teach-run" type="button">🤖 제미나이 자동 학습시키기 (5개)</button>
      <span id="teach-status"></span>
    </div>

    <div id="teach-result" class="teach-result"></div>
  </section>

  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>전체 학습</span></div>
    <div class="stat"><b id="s-clean">0</b><span>건전</span></div>
    <div class="stat"><b id="s-normal">0</b><span>일반</span></div>
    <div class="stat"><b id="s-dorat">0</b><span>도랏</span></div>
    <div class="stat"><b id="s-votes">0</b><span>👍 / 👎</span></div>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="말이나 대답으로 검색…">
    <select id="mode-filter">
      <option value="">모든 모드</option>
      <option value="clean">건전</option>
      <option value="normal">일반</option>
      <option value="dorat">도랏</option>
    </select>
    <select id="sort">
      <option value="new">최신순</option>
      <option value="old">오래된순</option>
      <option value="vote">좋아요순</option>
    </select>
    <button id="reload">새로고침</button>
  </div>

  <div id="list" class="list"><div class="empty">불러오는 중…</div></div>
</section>

<!-- ══ 탭 2: 기본 내장 (읽기 전용) ══ -->
<section id="tab-builtin" class="wrap" hidden>
  <div class="stats">
    <div class="stat"><b id="b-intents">-</b><span>내장 의도</span></div>
    <div class="stat"><b id="b-pairs">-</b><span>Q&amp;A 쌍</span></div>
    <div class="stat"><b id="b-replies">-</b><span>모드별 답변 총계</span></div>
    <div class="stat ok"><b id="b-min">-</b><span>모드별 최소 답변</span></div>
  </div>

  <div class="toolbar">
    <input id="b-search" type="search" placeholder="id · 트리거 · 답변으로 검색…">
    <select id="b-kind">
      <option value="">전체</option>
      <option value="intent">의도</option>
      <option value="pair">Q&amp;A 쌍</option>
    </select>
    <select id="b-mode">
      <option value="">모든 모드</option>
      <option value="clean">건전</option>
      <option value="normal">일반</option>
      <option value="dorat">도랏</option>
    </select>
  </div>

  <div id="b-list" class="list"><div class="empty">불러오는 중…</div></div>
</section>

<script src="./js/config.js?v=2.7"></script>
<script src="./js/safety.js?v=2.7"></script>
<script>
(function () {
  "use strict";
  var DB = "https://dorati-99953-default-rtdb.asia-southeast1.firebasedatabase.app";
  /* 패스코드 게이트(소프트 게이트): 입력값의 SHA-256 앞 16자리를 비교한다.
     실제 보호는 DB 규칙이 담당하며, 이 화면은 실수로 들어오는 것을 막는 용도. */
  var PIN_HASH = "4e37d0d52a34a46d";
  var SESSION_KEY = "dorati.admin.ok";
  var THEME_KEY = "dorati.admin.theme";
  var pairs = [];
  var gate = document.getElementById("gate");
  var gateForm = document.getElementById("gate-form");
  var pinInput = document.getElementById("pin");
  var errEl = document.getElementById("err");

  /* ── 테마: 간지모드(기본) / 심플모드 ────────────────── */
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(name) {
    var t = name === "simple" ? "simple" : "ganji";
    document.body.dataset.theme = t;
    themeBtn.textContent = t === "ganji" ? "🎛 간지모드" : "📄 심플모드";
    themeBtn.setAttribute("aria-pressed", t === "ganji" ? "true" : "false");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", t === "ganji" ? "#111214" : "#f6f3ee");
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* noop */ }
  }
  var savedTheme = "ganji";
  try { savedTheme = localStorage.getItem(THEME_KEY) || "ganji"; } catch (e) { /* noop */ }
  applyTheme(savedTheme);
  themeBtn.addEventListener("click", function () {
    applyTheme(document.body.dataset.theme === "ganji" ? "simple" : "ganji");
  });

  function sha256(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ("00" + b.toString(16)).slice(-2);
      }).join("").slice(0, 16);
    });
  }

  function unlock() {
    gate.hidden = true;
    sessionStorage.setItem(SESSION_KEY, "1");
    load();
  }
  function lock() {
    sessionStorage.removeItem(SESSION_KEY);
    gate.hidden = false;
    pinInput.value = "";
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") { unlock(); } else { gate.hidden = false; }

  gateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = pinInput.value.trim();
    if (!v) { errEl.textContent = "패스코드를 입력해 주세요"; return; }
    sha256("dorati-admin::" + v).then(function (h) {
      if (h === PIN_HASH) { errEl.textContent = ""; unlock(); }
      else { errEl.textContent = "패스코드가 맞지 않아요"; pinInput.value = ""; }
    });
  });

  document.getElementById("logout").addEventListener("click", lock);

  /* ── 탭 전환 ────────────────────────────────────────── */
  var tabs = { human: document.getElementById("tab-human"), builtin: document.getElementById("tab-builtin") };
  var tabBtns = { human: document.getElementById("tab-btn-human"), builtin: document.getElementById("tab-btn-builtin") };
  var currentTab = "human";

  function showTab(name) {
    if (!tabs[name]) return;
    currentTab = name;
    for (var k in tabs) {
      tabs[k].hidden = k !== name;
      tabBtns[k].setAttribute("aria-selected", String(k === name));
    }
    if (name === "builtin") {
      loadBuiltin().then(renderBuiltin);
    }
  }

  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", function () { showTab(b.dataset.tab); });
  });

  /* ══ 탭 1: 사람 학습 ══════════════════════════════════ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function when(ts) {
    if (!ts) return "-";
    var d = new Date(ts);
    return d.toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function load() {
    fetch(DB + "/pairs.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (obj) {
        pairs = [];
        for (var id in (obj || {})) {
          var v = obj[id];
          if (!v || typeof v !== "object" || !v.q) continue;
          pairs.push({
            id: id, q: v.q, a: v.a || "", m: v.m || "normal", t: Number(v.t || 0),
            up: Number((v.v && v.v.up) || 0), down: Number((v.v && v.v.down) || 0), r: Number(v.r || 0)
          });
        }
        renderHuman();
      })
      .catch(function () {
        document.getElementById("list").innerHTML = '<div class="empty">불러오기 실패 — 잠시 뒤 새로고침해 주세요.</div>';
      });
  }

  function humanCounts() {
    var c = { total: pairs.length, clean: 0, normal: 0, dorat: 0, votes: 0 };
    pairs.forEach(function (p) {
      c[p.m] = (c[p.m] || 0) + 1;
      c.votes += p.up + p.down;
    });
    document.getElementById("s-total").textContent = c.total;
    document.getElementById("s-clean").textContent = c.clean;
    document.getElementById("s-normal").textContent = c.normal;
    document.getElementById("s-dorat").textContent = c.dorat;
    document.getElementById("s-votes").textContent = c.votes;
    document.getElementById("c-human").textContent = c.total;
    return c;
  }

  function renderHuman() {
    humanCounts();
    var q = document.getElementById("search").value.trim().toLowerCase();
    var mf = document.getElementById("mode-filter").value;
    var sort = document.getElementById("sort").value;
    var rows = pairs.filter(function (p) {
      if (mf && p.m !== mf) return false;
      if (!q) return true;
      return (p.q + " " + p.a).toLowerCase().indexOf(q) >= 0;
    });
    rows.sort(function (a, b) {
      if (sort === "old") return a.t - b.t;
      if (sort === "vote") return (b.up - b.down) - (a.up - a.down);
      return b.t - a.t;
    });

    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (pairs.length ? "조건에 맞는 말이 없어요." : "아직 학습된 말이 없어요. 도랏이와 대화하거나 위에서 제미나이 자동 학습을 눌러보세요.") + "</div>";
      return;
    }
    list.innerHTML = rows.map(function (p) {
      return '<div class="item" data-id="' + esc(p.id) + '">' +
        '<div><div class="q">' + esc(p.q) + '</div><div class="a">→ ' + esc(p.a) + '</div>' +
        '<div class="meta"><span class="tag ' + esc(p.m) + '">' + ({ clean: "건전", normal: "일반", dorat: "도랏" }[p.m] || p.m) + '</span>' +
        '<span>👍 ' + p.up + ' · 👎 ' + p.down + '</span>' +
        (p.r ? '<span>신고 ' + p.r + '</span>' : '') +
        '<span>' + when(p.t) + '</span></div></div>' +
        '<div class="acts"><button class="edit">수정</button><button class="del">삭제</button></div>' +
        '</div>';
    }).join("");
  }

  document.getElementById("search").addEventListener("input", renderHuman);
  document.getElementById("mode-filter").addEventListener("change", renderHuman);
  document.getElementById("sort").addEventListener("change", renderHuman);
  document.getElementById("reload").addEventListener("click", load);

  document.getElementById("list").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn) return;
    var card = btn.closest(".item");
    var id = card.getAttribute("data-id");
    var item = pairs.filter(function (p) { return p.id === id; })[0];
    if (!item) return;

    if (btn.classList.contains("del")) {
      if (!confirm("삭제할까요?\n\n" + item.q.slice(0, 60) + "\n→ " + item.a.slice(0, 60))) return;
      fetch(DB + "/pairs/" + encodeURIComponent(id) + ".json", { method: "DELETE" })
        .then(function () {
          pairs = pairs.filter(function (p) { return p.id !== id; });
          renderHuman();
        });
    }
    if (btn.classList.contains("edit")) {
      var next = prompt("새 대답으로 바꿀까요?", item.a);
      if (next === null) return;
      next = next.trim().slice(0, 400);
      if (!next) return;
      fetch(DB + "/pairs/" + encodeURIComponent(id) + ".json", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ a: next })
      }).then(function () { item.a = next; renderHuman(); });
    }
  });

  /* ══ 제미나이 자동 학습 ══════════════════════════════ */
  var PROXY = String((window.DORATI_CONFIG && window.DORATI_CONFIG.smartProxy) || "").trim();
  var teachMode = "auto";
  var teachBusy = false;
  var teachBtn = document.getElementById("teach-run");
  var teachStatus = document.getElementById("teach-status");
  var teachResult = document.getElementById("teach-result");

  function prettyModel(name) {
    var m = String(name || "gemini-3.8-flash").replace(/^gemini-/i, "").split("-");
    var out = ["Gemini"];
    m.forEach(function (p) {
      if (!p) return;
      out.push(/^\d/.test(p) ? p : p.charAt(0).toUpperCase() + p.slice(1));
    });
    return out.join(" ");
  }

  function setTeachMode(mode) {
    teachMode = mode === "custom" ? "custom" : "auto";
    document.querySelectorAll("[data-teach-mode]").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.teachMode === teachMode));
    });
    document.getElementById("teach-custom").hidden = teachMode !== "custom";
    document.getElementById("teach-topic").hidden = teachMode === "custom";
  }
  document.querySelectorAll("[data-teach-mode]").forEach(function (b) {
    b.addEventListener("click", function () { setTeachMode(b.dataset.teachMode); });
  });
  setTeachMode("auto");

  function normalizeQ(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[\s\u00a0]+/g, "")
      .replace(/[^\w가-힣ㄱ-ㅎㅏ-ㅣ]/g, "")
      .replace(/[ㅋㅎ]{2,}/g, "ㅋㅋ");
  }

  function safePair(q, a) {
    if (!window.Safety) return true;
    return window.Safety.scan(q).safe && window.Safety.scan(a).safe;
  }

  function renderTeachResult(added, skipped, model) {
    if (!added.length && !skipped.length) { teachResult.innerHTML = ""; return; }
    var head = '<div class="tr-head">' +
      '<span class="tr-badge">' + esc(prettyModel(model)) + '</span>' +
      '<span class="tr-sum">새로 배운 말 <b>' + added.length + '</b>개' +
      (skipped.length ? ' · 안전필터로 제외 <b>' + skipped.length + '</b>개' : '') + '</span></div>';
    var rows = added.map(function (p) {
      return '<div class="tp"><div class="tp-q">' + esc(p.q) + '</div>' +
        '<div class="tp-a">→ ' + esc(p.a) + '</div>' +
        '<div class="tp-meta"><span class="tag ' + esc(p.m) + '">' +
        ({ clean: "건전", normal: "일반", dorat: "도랏" }[p.m] || p.m) + '</span></div></div>';
    }).join("");
    teachResult.innerHTML = head + rows;
  }

  function runTeach() {
    if (teachBusy) return;
    if (!PROXY) { teachStatus.textContent = "중계 주소가 설정되지 않았어요."; return; }
    var target = document.getElementById("teach-target").value;
    var instruction = "";
    if (teachMode === "custom") {
      instruction = document.getElementById("teach-instruction").value.trim();
      if (!instruction) { teachStatus.textContent = "추가 명령을 적어주세요."; return; }
    } else {
      var topic = document.getElementById("teach-topic").value.trim();
      instruction = topic ? "주제: " + topic : "";
    }

    teachBusy = true;
    teachBtn.disabled = true;
    teachStatus.textContent = "제미나이가 생각 중…";
    teachResult.innerHTML = "";

    fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "teach", target: target, instruction: instruction }),
      redirect: "follow",
      cache: "no-store"
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (t) {
        var j;
        try { j = JSON.parse(t); } catch (e) { throw new Error("응답을 읽지 못했어요"); }
        if (!j || !j.ok) throw new Error((j && j.error) || "생성 실패");
        var list = j.pairs || [];
        if (!list.length) throw new Error("만들어진 말이 없어요");
        if (j.model) document.getElementById("teach-model").textContent = prettyModel(j.model);

        var added = [], skipped = [];
        var chain = Promise.resolve();
        list.forEach(function (p) {
          chain = chain.then(function () {
            var q = String(p.q || "").trim().slice(0, 200);
            var a = String(p.a || "").trim().slice(0, 400);
            if (!q || !a) return;
            if (!safePair(q, a)) { skipped.push(p); return; }
            var m = (p.mode === "clean" || p.mode === "dorat") ? p.mode : "normal";
            var body = { q: q, qn: normalizeQ(q), a: a, m: m, t: Date.now() };
            return fetch(DB + "/pairs.json", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            }).then(function (r) { return r.json().catch(function () { return null; }); })
              .then(function (res) {
                if (res && res.name) { body.id = res.name; added.push(body); }
              })
              .catch(function () { /* 한 건 실패는 넘어간다 */ });
          });
        });
        return chain.then(function () {
          renderTeachResult(added, skipped, j.model);
          teachStatus.textContent = added.length + "개 저장 완료" + (skipped.length ? " · " + skipped.length + "개는 안전필터로 제외" : "");
          if (added.length) load();
        });
      })
      .catch(function (e) {
        teachStatus.textContent = "실패: " + (e && e.message ? e.message : e);
      })
      .then(function () {
        teachBusy = false;
        teachBtn.disabled = false;
      });
  }

  teachBtn.addEventListener("click", runTeach);

  /* ══ 탭 2: 기본 내장 (읽기 전용) ══════════════════════ */
  var builtin = { loaded: false, loading: null, items: [], shown: 60 };

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("script load failed: " + src)); };
      document.head.appendChild(s);
    });
  }

  function loadBuiltin() {
    if (builtin.loaded) return Promise.resolve();
    if (builtin.loading) return builtin.loading;
    document.getElementById("b-list").innerHTML = '<div class="empty">내장 대화를 불러오는 중…</div>';
    builtin.loading = loadScript("./js/kb-dialogues.js?v=2.7")
      .then(function () { return loadScript("./js/kb-corpus.js?v=2.7"); })
      .then(function () {
        var C = window.DORATI_CORPUS || { intents: [], pairs: [] };
        builtin.items = [];
        (C.intents || []).forEach(function (it) {
          builtin.items.push({
            kind: "intent", id: it.id, re: it.re || "",
            clean: [].concat(it.clean || []), normal: [].concat(it.normal || []), dorat: [].concat(it.dorat || [])
          });
        });
        (C.pairs || []).forEach(function (p) {
          builtin.items.push({
            kind: "pair", id: p.q, re: "",
            clean: [].concat(p.clean || []), normal: [].concat(p.normal || []), dorat: [].concat(p.dorat || [])
          });
        });
        builtin.loaded = true;
        builtin.loading = null;
        return true;
      })
      .catch(function () {
        builtin.loading = null;
        document.getElementById("b-list").innerHTML = '<div class="empty">내장 대화 파일을 불러오지 못했어요. 새로고침해 주세요.</div>';
      });
    return builtin.loading;
  }

  function builtinCounts() {
    var intents = 0, pairCount = 0, replies = 0, min = 99;
    builtin.items.forEach(function (it) {
      if (it.kind === "intent") intents++; else pairCount++;
      replies += it.clean.length + it.normal.length + it.dorat.length;
      min = Math.min(min, it.clean.length, it.normal.length, it.dorat.length);
    });
    document.getElementById("b-intents").textContent = intents;
    document.getElementById("b-pairs").textContent = pairCount;
    document.getElementById("b-replies").textContent = replies;
    document.getElementById("b-min").textContent = (min === 99 ? "-" : min + "개");
    document.getElementById("c-builtin").textContent = replies;
  }

  function matches(it, q, mode) {
    if (!q) return true;
    var hay = it.id + " " + it.re + " " + it.clean.join(" ") + " " + it.normal.join(" ") + " " + it.dorat.join(" ");
    if (mode) hay += " " + (mode === "clean" ? "건전" : mode === "dorat" ? "도랏" : "일반");
    return hay.toLowerCase().indexOf(q) >= 0;
  }

  function group(title, cls, list) {
    if (!list.length) return "";
    return '<div class="rgroup ' + cls + '"><h4>' + title + "</h4><ul>" +
      list.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>";
  }

  function renderBuiltin() {
    if (!builtin.loaded) return;
    builtinCounts();
    var q = document.getElementById("b-search").value.trim().toLowerCase();
    var kind = document.getElementById("b-kind").value;
    var mode = document.getElementById("b-mode").value;
    var rows = builtin.items.filter(function (it) {
      if (kind && it.kind !== kind) return false;
      return matches(it, q, mode);
    });
    var list = document.getElementById("b-list");
    if (!rows.length) {
      list.innerHTML = '<div class="empty">조건에 맞는 내장 대화가 없어요.</div>';
      return;
    }
    var slice = rows.slice(0, builtin.shown);
    var html = slice.map(function (it) {
      var head = '<div class="bhead"><span class="id">' + esc(it.id) + "</span>" +
        '<span class="tag kind">' + (it.kind === "intent" ? "의도" : "Q&A") + "</span>";
      if (it.kind === "intent" && it.re) head += "<code>" + esc(it.re) + "</code>";
      head += "</div>";
      var body = '<div class="replies">' +
        (mode && mode !== "clean" ? "" : group("건전 · " + it.clean.length, "clean", it.clean)) +
        (mode && mode !== "normal" ? "" : group("일반 · " + it.normal.length, "normal", it.normal)) +
        (mode && mode !== "dorat" ? "" : group("도랏 · " + it.dorat.length, "dorat", it.dorat)) +
        "</div>";
      return '<div class="bcard">' + head + body + "</div>";
    }).join("");
    if (rows.length > slice.length) {
      html += '<button class="more" id="b-more">더 보기 (' + slice.length + " / " + rows.length + ")</button>";
    }
    list.innerHTML = html;
    var more = document.getElementById("b-more");
    if (more) more.addEventListener("click", function () { builtin.shown += 60; renderBuiltin(); });
  }

  document.getElementById("b-search").addEventListener("input", function () { builtin.shown = 60; renderBuiltin(); });
  document.getElementById("b-kind").addEventListener("change", function () { builtin.shown = 60; renderBuiltin(); });
  document.getElementById("b-mode").addEventListener("change", function () { builtin.shown = 60; renderBuiltin(); });

  load();
})();
</script>
</body>
</html>
