<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(900px 480px at 82% 12%, #ffe2c9 0%, transparent 62%),
      radial-gradient(760px 520px at 12% 92%, #e9ddfb 0%, transparent 60%),
      #fff9f3;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 78px;
  }
  .left{max-width:660px}
  .kicker{
    display:inline-block;font-size:24px;font-weight:800;color:#b2560f;
    background:#ffe8d8;border-radius:999px;padding:9px 22px;letter-spacing:-.01em;
  }
  h1{
    font-size:118px;line-height:.98;letter-spacing:-.055em;margin:22px 0 14px;color:#2a1d12;font-weight:900;
  }
  h1 .dot{color:#ff8a3d}
  p.sub{font-size:31px;color:#6b5a4b;line-height:1.42;font-weight:700;letter-spacing:-.02em}
  .chips{display:flex;gap:12px;margin-top:34px}
  .chip{
    font-size:22px;font-weight:800;padding:11px 20px;border-radius:14px;color:#fff;
    box-shadow:0 8px 20px rgba(60,40,20,.14);
  }
  .c1{background:#3e9e7a}
  .c2{background:#ff8a3d}
  .c3{background:#7b3fe4}
  .right{position:relative;width:400px;height:400px;flex:0 0 400px}
  .right svg{width:400px;height:400px;filter:drop-shadow(0 26px 40px rgba(120,70,20,.22))}
  .bubble{
    position:absolute;right:-6px;top:-24px;background:#fff;border:5px solid #2a1d12;border-radius:26px;
    padding:16px 24px;font-size:27px;font-weight:900;color:#2a1d12;letter-spacing:-.03em;
    box-shadow:0 14px 26px rgba(60,40,20,.16);transform:rotate(4deg);
  }
  .bubble:after{content:"";position:absolute;left:34px;bottom:-26px;border:13px solid transparent;border-top-color:#2a1d12}
</style>
</head>
<body>
  <div class="left">
    <span class="kicker">🧠 사람들이 가르칠수록 똑똑해짐</span>
    <h1>도랏이<span class="dot">.</span></h1>
    <p class="sub">말 걸어봐. 내가 배운 대로 깝쳐줄게.<br>건전 · 일반 · 도랏 3가지 모드</p>
    <div class="chips"><span class="chip c1">😇 건전</span><span class="chip c2">😏 일반</span><span class="chip c3">🤪 도랏</span></div>
  </div>
  <div class="right">
    <div class="bubble">뭐, 나한테 말 걸어?</div>
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="g" cx="35%" cy="26%" r="82%">
          <stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff8a3d"/>
        </radialGradient>
      </defs>
      <ellipse cx="50" cy="92" rx="27" ry="4" fill="#000" opacity=".08"/>
      <path d="M50 16c21 0 37 15 37 35 0 18-15 30-37 30S13 69 13 51c0-20 16-35 37-35z" fill="url(#g)" stroke="#b2560f" stroke-width="2.4"/>
      <path d="M24 39q7-14 20-17" stroke="#fff" stroke-width="3.4" fill="none" opacity=".55" stroke-linecap="round"/>
      <ellipse cx="35" cy="53" rx="7.6" ry="9" fill="#fff"/><ellipse cx="65" cy="53" rx="7.6" ry="9" fill="#fff"/>
      <circle cx="36" cy="54" r="3.9" fill="#b2560f"/><circle cx="64" cy="54" r="3.9" fill="#b2560f"/>
      <circle cx="37.4" cy="52.2" r="1.4" fill="#fff"/><circle cx="65.4" cy="52.2" r="1.4" fill="#fff"/>
      <path d="M42 68q8 7 16-1" stroke="#b2560f" stroke-width="2.9" fill="none" stroke-linecap="round"/>
      <ellipse cx="25" cy="63" rx="5.2" ry="3.2" fill="#ff9aa8" opacity=".5"/>
      <ellipse cx="75" cy="63" rx="5.2" ry="3.2" fill="#ff9aa8" opacity=".5"/>
      <path d="M25 45q6-4 12-2" stroke="#b2560f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M63 43q6-2 12 2" stroke="#b2560f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
